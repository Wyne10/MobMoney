regenerate: true
lang: 'en.yml'
usePlayerLanguage: true
# LEGACY/ENHANCED_LEGACY/MINI_MESSAGE
serializer: MINI_MESSAGE
# OFF/FATAL/ERROR/WARN/INFO/DEBUG/TRACE/ALL
logLevel: INFO

# Money multipliers. The base drop of every kill is multiplied by the highest
# multiplier among the entries whose permission the killer has; 1.0 if none.
# Entry keys are names of your own choosing, one entry per group or rank.
multiplier:
  default:
    multiplier: 1.0
    permission: 'group.default'

# Experience multipliers, applied the same way to the experience the mob drops.
xp-multiplier:
  default:
    multiplier: 1.0
    permission: 'group.default'

# Base money per kill, as a 'min..max' range a random amount is rolled from.
# Keys are either a single entity type or a category; a range set for an entity
# type overrides the one it inherits from its category.
# https://jd.papermc.io/paper/1.16.5/org/bukkit/entity/EntityType.html
# ANY/ANIMALS/MONSTERS/AMBIENT/WATER_ANIMALS
drop:
  ANIMALS: 1.0..3.0
  MONSTERS: 5.0..10.0
  PIG: 20.0..55.0
